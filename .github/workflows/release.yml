name: Release on PR merge

# Fires when a pull request into `main` is closed. `merged == true` is what
# distinguishes an actual (squash-)merge from a PR that was just closed.
# Releases only happen when the merged PR carries the `release` label
# (opt-in), or when manually triggered via workflow_dispatch.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 1. Bump the version and tag the release ──────────────────────
  bump-version:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # The default GITHUB_TOKEN authenticates as github-actions[bot], which
          # the "main" ruleset's pull_request rule can't bypass on a personal
          # (non-org) repo — only the "Repository admin" role can be added to
          # its bypass list. RELEASE_PAT is a fine-grained PAT (Contents:
          # read/write, scoped to this repo) belonging to the repo admin, so
          # the version-bump push below authenticates as an actor the ruleset
          # is actually allowed to let through.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Skip if last commit is already a release bump
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q "^chore: bump version to"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        id: bump
        if: steps.guard.outputs.skip == 'false'
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version | tr -d 'v')
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.tag }}"

  # ── 2. Build installers on each OS ────────────────────────────────
  build:
    needs: bump-version
    if: needs.bump-version.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: "./build.sh"
            artifact: mac
          - os: windows-latest
            script: "pwsh ./build.ps1"
            artifact: win
          - os: ubuntu-latest
            script: "./build-linux.sh"
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install root npm deps
        run: npm install --no-audit --no-fund

      - name: Install Linux packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.script }}

      - name: Build (Windows/Linux)
        if: matrix.os != 'macos-latest'
        run: ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/*.tar.gz
            dist-electron/*.blockmap
          if-no-files-found: ignore

  # ── 3. Publish the GitHub Release ─────────────────────────────────
  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-electron
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.5.3
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: ${{ needs.bump-version.outputs.tag }}
          generate_release_notes: true
          files: dist-electron/**
